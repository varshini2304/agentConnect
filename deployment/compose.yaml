x-app: &app
  image: agentconnect-backend:local
  build:
    context: ..
    dockerfile: deployment/backend.Dockerfile
  environment: &environment
    AGENTCONNECT_DATABASE_URL: postgresql+psycopg://agentconnect:${AGENTCONNECT_DATABASE_PASSWORD:?Set AGENTCONNECT_DATABASE_PASSWORD}@db:5432/agentconnect
    AGENTCONNECT_ENV: production
    AGENTCONNECT_TRUSTED_ORIGINS: ${AGENTCONNECT_TRUSTED_ORIGINS:?Set the explicit HTTPS origin}
    AGENTCONNECT_COOKIE_SECURE: "true"
    AGENTCONNECT_DEV_INVITATIONS: "false"
    AGENTCONNECT_ENABLE_FAKE: "false"
    AGENTCONNECT_LIMITS: ${AGENTCONNECT_LIMITS:?Set platform limits JSON from deployment/.env.example}
    AGENTCONNECT_DAILY_COMPANY_BUDGET: ${AGENTCONNECT_DAILY_COMPANY_BUDGET:-1000}
    AGENTCONNECT_WRITE_ATTEMPTS: ${AGENTCONNECT_WRITE_ATTEMPTS:-600}
    AGENTCONNECT_LOGIN_ATTEMPTS: ${AGENTCONNECT_LOGIN_ATTEMPTS:-10}
    AGENTCONNECT_SESSION_HOURS: ${AGENTCONNECT_SESSION_HOURS:-24}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
  restart: unless-stopped
  init: true

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment/.env}
      AGENTCONNECT_DATABASE_PASSWORD: ${AGENTCONNECT_DATABASE_PASSWORD:?Set AGENTCONNECT_DATABASE_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./init-db.sql:/docker-entrypoint-initdb.d/10-agentconnect.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    <<: *app
    command: [python, scripts/migrate_postgres.py, --initialize]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    stop_grace_period: 150s

  worker:
    <<: *app
    command: [python, -m, app.worker]
    depends_on:
      backend:
        condition: service_healthy
    stop_grace_period: 150s

  frontend:
    build:
      context: ..
      dockerfile: deployment/frontend.Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
